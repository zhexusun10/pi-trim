name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        pi: ["1.0.0", "1.4.0", "1.5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - if: ${{ matrix.pi != '1.5.0' }}
        run: npm install --no-save --ignore-scripts --package-lock=false @earendil-works/pi-coding-agent@${{ matrix.pi }} @earendil-works/pi-ai@${{ matrix.pi }}
      - run: npm run check
      - run: npm test
      - if: ${{ matrix.pi == '1.5.0' }}
        run: npm run benchmark
      - run: npm pack --dry-run
